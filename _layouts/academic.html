<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% unless page.url == '/' %}{{ page.title | escape }} · {% endunless %}Artemis Panagopoulou</title>
  <meta name="description" content="{{ page.description | default: site.description | strip | escape }}">
  <meta name="theme-color" content="#ffffff">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:title" content="{{ page.title | default: site.title | escape }} · Artemis Panagopoulou">
  <meta property="og:description" content="{{ page.description | default: site.description | strip | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ '/assets/img/prof_pic.jpg' | absolute_url }}">
  <meta name="twitter:card" content="summary">
  <link rel="icon" href="{{ '/assets/img/research/favicon.svg' | relative_url }}" type="image/svg+xml">
  <link rel="stylesheet" href="{{ '/assets/css/academic.css' | relative_url }}">
  <script>try{var t=localStorage.getItem('academic-theme');if(t==='dark'||(!t&&matchMedia('(prefers-color-scheme: dark)').matches))document.documentElement.dataset.theme='dark'}catch(e){}</script>
  <script src="{{ '/assets/js/academic.js' | relative_url }}" defer></script>
  {% if page.url == '/' %}
  <script type="application/ld+json">{"@context":"https://schema.org","@type":"Person","name":"Artemis Panagopoulou","url":{{ site.url | jsonify }},"image":{{ '/assets/img/prof_pic.jpg' | absolute_url | jsonify }},"jobTitle":"Senior Research Scientist","worksFor":{"@type":"Organization","name":"Salesforce Research"},"alumniOf":{"@type":"CollegeOrUniversity","name":"University of Pennsylvania"},"sameAs":["https://scholar.google.com/citations?user=3agzZjYAAAAJ","https://github.com/artemisp","https://www.linkedin.com/in/apanagop/"],"knowsAbout":["Multimodal machine learning","Synthetic data","Cross-modal reasoning","Model evaluation"]}</script>
  {% endif %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <header class="site-header">
    <div class="shell header-inner">
      <a class="wordmark" href="{{ '/' | relative_url }}">Artemis Panagopoulou<span class="wordmark-dot" aria-hidden="true">.</span></a>
      <nav aria-label="Main navigation">
        <a href="{{ '/' | relative_url }}" {% if page.url == '/' %}aria-current="page"{% endif %}>Research</a>
        <a href="{{ '/publications/' | relative_url }}" {% if page.url contains '/publications/' %}aria-current="page"{% endif %}>Publications</a>
        <a href="{{ '/cv/' | relative_url }}" {% if page.url contains '/cv/' %}aria-current="page"{% endif %}>CV</a>
        <a href="{{ '/teaching/' | relative_url }}" {% if page.url contains '/teaching/' %}aria-current="page"{% endif %}>Teaching</a>
        <a href="{{ '/news/' | relative_url }}" {% if page.url == '/news/' %}aria-current="page"{% endif %}>News</a>
        <button class="theme-toggle" type="button" aria-label="Switch to dark theme" title="Switch theme">
          <svg class="theme-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M20.4 14A8.5 8.5 0 0 1 10 3.6 8.5 8.5 0 1 0 20.4 14Z"/></svg>
          <svg class="theme-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg>
        </button>
      </nav>
    </div>
  </header>
  <main id="main" class="shell {% if page.url == '/' %}home{% else %}inner-page{% endif %}">
    {{ content }}
  </main>
  <footer class="site-footer shell">
    <span>© {{ site.time | date: '%Y' }} Artemis Panagopoulou<span class="footer-credit">Website polished with help from Codex.</span></span>
    <div><a href="mailto:{{ site.email }}">Email</a><a href="https://scholar.google.com/citations?user=3agzZjYAAAAJ&amp;hl=en">Google Scholar</a><a href="https://github.com/artemisp/artemisp.github.io">Site source</a></div>
  </footer>
</body>
</html>
